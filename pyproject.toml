[project]
name = "vidnotes"
dynamic = ["version"]
description = "Video → markdown: transcript and screenshots of key moments"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "pywhispercpp>=1.5",
    "av>=13",
    "numpy",
]

[project.scripts]
vidnotes = "vidnotes:main"

[project.gui-scripts]
vidnotes-gui = "vidnotes_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# версия живёт одна — в манифесте плагина, им она и раздаётся
[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
only-include = ["vidnotes.py", "vidnotes_gui.py"]

[tool.hatch.build.targets.sdist]
only-include = [
    "vidnotes.py", "vidnotes_gui.py", "README.md", "CLAUDE.md", "LICENSE",
    ".claude-plugin/plugin.json",
]
