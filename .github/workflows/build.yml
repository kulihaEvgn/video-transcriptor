name: build

# Сборки делаются здесь, а не на ноутбуке: Windows-версию с макбука не собрать.
# Запускать вручную (Actions → build → Run workflow) или пушем тега вида v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # иначе шаг релиза упирается в 403
    defaults:
      run:
        shell: bash # на windows-раннере это git-bash: одна команда на обе системы

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install . pyinstaller

      - name: Собрать
        run: |
          pyinstaller --noconfirm --clean --windowed --name vidnotes \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            --collect-all tokenizers \
            --exclude-module onnxruntime \
            --hidden-import vidnotes \
            --paths . \
            vidnotes_gui.py

      - name: Упаковать
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "macos" ]; then
            zip -qry ../vidnotes-macos.zip vidnotes.app
          else
            7z a -tzip ../vidnotes-windows.zip vidnotes >/dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vidnotes-${{ matrix.name }}
          path: vidnotes-${{ matrix.name }}.zip

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vidnotes-${{ matrix.name }}.zip
